server:
  host: 0.0.0.0            # 0.0.0.0 = reachable from your phone on the same Wi-Fi (login required); 127.0.0.1 = this laptop only
  port: 5000

backend: cli            # cli = uses your Claude subscription via Claude Code (no API key); api = pay-per-token API key
models:
  score: haiku
  tailor: sonnet

min_score: 65             # jobs scoring below this are skipped (no tailoring cost)
max_score_per_run: 20     # LLM-scores only the best-matching N new jobs per search (the free local filter ranks them)
max_tailor_per_run: 10    # cap on tailored applications per search - this is your main token-cost control
auto_fetch_hours: 24      # while the app is open, search for new jobs every N hours (0 = only when you click)
auto_approve_min_score: 0 # 0 = you approve every job. e.g. 85 = jobs scoring 85+ start filling without a click
auto_click_submit: false  # false = form is filled, YOU press Submit. Turn on only after you trust it.
ask_optional: false       # false = optional fields you've never answered are left blank instead of asked

search:
  min_salary_lpa: 6       # lakhs per annum
  unknown_salary: include # most Indian postings hide pay. include = keep them, flagged "salary not listed"; skip = drop
  max_days_old: 7
  min_skill_overlap: 2    # free local check: posting must mention at least N skills from your resume
  include_titles: ["engineer", "developer", "sde", "backend", "intern", "graduate", "trainee", "software", "programmer"]
  exclude_titles: ["senior", "staff", "principal", "lead", "director", "manager", "head", "vp ", "architect"]
  locations: ["remote", "bengaluru", "bangalore"]   # remote jobs restricted to other countries are dropped automatically
  adzuna_where: ""        # Adzuna is filtered by `locations` too
  queries: ["software engineer", "backend developer", "full stack developer", "java developer",
            "software developer intern", "python developer", "sde"]

# Job sites driven in YOUR logged-in jobbot browser (click "Open jobbot browser to log in" once).
# Their terms forbid automation and accounts can get restricted - keep these numbers modest. [] turns it off.
# Logins and "verify you are human" checks are never bypassed: it pauses until you clear them.
platforms:
  enabled: [linkedin, naukri, indeed, wellfound]
  queries: ["software engineer", "backend developer", "java developer"]   # each searched in Bengaluru + remote
  max_jobs_per_platform: 15   # new job pages read per platform per search
  delay_seconds: 6            # pause between page loads
  linkedin_easy_apply_only: true  # Easy Apply forms can be filled in-site; others jump to company sites

sources:
  adzuna: true            # needs free keys: $env:ADZUNA_APP_ID and $env:ADZUNA_APP_KEY (skipped with a note if missing)
  remotive: true
  # Company boards (public APIs). Verified to exist; add more from careers URLs:
  #   boards.greenhouse.io/<token>   jobs.lever.co/<slug>   jobs.ashbyhq.com/<name>
  greenhouse: [razorpaysoftwareprivatelimited, groww, slice, druva, inmobi, databricks, cloudflare, datadog, elastic,
               gitlab, mongodb, twilio, okta, grafanalabs, vercel, stripe, airbnb, figma, anthropic, scaleai, brex,
               coinbase, samsara, pinterest, reddit, dropbox, lyft, instacart, robinhood, affirm, asana, gusto,
               toast, block, netlify, squarespace]
  lever: [cred, meesho]
  ashby: [atlan, snowflake, supabase, notion, ramp, openai, linear, plaid, cohere, tekion]
